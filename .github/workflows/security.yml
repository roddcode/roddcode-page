name: Dependency security

on:
  schedule:
    # Mondays 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/dependabot.yml
      - .github/workflows/security.yml
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - .github/dependabot.yml
      - .github/workflows/security.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No --prod: dev dependencies are audited too. No --ignore-registry-errors:
      # an unreachable registry fails the job. No ignores or overrides.
      - run: pnpm audit --audit-level=moderate
